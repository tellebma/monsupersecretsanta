project_id = "monsupersecretsanta-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3100/auth/callback"]
minimum_password_length = 8

[auth.email]
enable_confirmations = true
max_frequency = "1s"

[auth.email.template.magic_link]
subject = "Ton code Mon Super Secret Santa"
content_path = "./supabase/templates/code.html"

[auth.email.template.confirmation]
subject = "Ton code Mon Super Secret Santa"
content_path = "./supabase/templates/code.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false
